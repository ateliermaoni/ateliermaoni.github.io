name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html robots.txt sitemap.xml google93bce739218ee220.html .nojekyll _site/
          cp -R assets en ka _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live website
        run: |
          site_url="${{ steps.deployment.outputs.page_url }}"
          site_url="${site_url%/}/"
          for path in "" ka/ en/ ka/work/ en/work/ ka/contact/ en/contact/ sitemap.xml robots.txt google93bce739218ee220.html assets/images/silver-04-1345.webp; do
            output="/tmp/atelier-maoni-${path//\//-}"
            curl --fail --location --retry 12 --retry-delay 10 --retry-all-errors \
              --max-time 30 "${site_url}${path}" --output "$output"
          done
          grep --quiet "Atelier MAONI" /tmp/atelier-maoni-
          grep --quiet 'google-site-verification.*7LdSylp-PoeOl1Tydj36mwL5AsnJVtEEeNuD18H91es' /tmp/atelier-maoni-
          grep --quiet 'google-site-verification.*7LdSylp-PoeOl1Tydj36mwL5AsnJVtEEeNuD18H91es' /tmp/atelier-maoni-ka-
          grep --quiet 'google-site-verification.*7LdSylp-PoeOl1Tydj36mwL5AsnJVtEEeNuD18H91es' /tmp/atelier-maoni-en-
          test "$(grep --only-matching 'data-image-index=' /tmp/atelier-maoni-ka-work- | wc --lines)" -eq 33
          test "$(grep --only-matching 'data-image-index=' /tmp/atelier-maoni-en-work- | wc --lines)" -eq 33
          grep --quiet 'https://maps.app.goo.gl/drJ2gnc8GKpYNQ599' /tmp/atelier-maoni-ka-contact-
          grep --quiet 'https://maps.app.goo.gl/drJ2gnc8GKpYNQ599' /tmp/atelier-maoni-en-contact-
          grep --quiet 'https://ateliermaoni.github.io/ka/' /tmp/atelier-maoni-sitemap.xml
          grep --quiet 'Sitemap: https://ateliermaoni.github.io/sitemap.xml' /tmp/atelier-maoni-robots.txt
          echo 'f75bfad8bea98f275ebba808ab0111984bbe0500f3c2fbeef8e88fa3716cc0e9  /tmp/atelier-maoni-google93bce739218ee220.html' | sha256sum --check --status

      - name: Mark verified deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "pages-live-${GITHUB_SHA}"
          git push origin "pages-live-${GITHUB_SHA}"
