name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html robots.txt sitemap.xml .nojekyll _site/
          cp -R assets en ka _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live website
        run: |
          curl --fail --location --retry 12 --retry-delay 10 --retry-all-errors \
            --max-time 30 "${{ steps.deployment.outputs.page_url }}" \
            --output /tmp/atelier-maoni-live.html
          grep --quiet "Atelier MAONI" /tmp/atelier-maoni-live.html

      - name: Mark verified deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "pages-live-${GITHUB_SHA}"
          git push origin "pages-live-${GITHUB_SHA}"
